            <h1 class="page-title">Contact</h1>
            <p>
                Whether you're exploring violin lessons for the first time,
                returning to music after many years, or seeking opportunities
                to continue growing as a musician, I'd love to hear from you.
            </p>
        </section>

        <form action="https://formspree.io/f/xjgpnjbw" method="POST">
            <label for="name">Name</label>
            <input id="name" name="name" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">Send</button>
        </form>
