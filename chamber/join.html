<body>
    <header>
        <img src="images/home-icon.png" alt="Chamber Logo"
            class="header-icon">
        <button id="hamburger" aria-label="Menu"
            class="wave-emoji">🌊</button>
        <nav id="menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="discover.html">Discover</a></li>
                <li><a href="directory.html">Directory</a></li>
                <li><a href="join.html">Join</a></li>
            </ul>
        </nav>
    </header>

    <main class="join">
        <section class="join-form">
            <h1>Join the Chamber</h1>
            <form method="get" action="thankyou.html" id="joinForm">
                <label>First Name<input type="text" name="firstName"
                        required autocomplete="given-name"></label>
                <label>Last Name<input type="text" name="lastName"
                        required autocomplete="family-name" ></label>
                <label>Title<input type="text" name="title" autocomplete="organization-title"></label>
                <label>Email<input type="email" name="email"
                        required></label>
                <label>Phone<input type="tel" name="phone"
                        required></label>
                <label>Organization<input type="text"
                        name="organization" required></label>
                <label>Business Description<textarea
                        name="description"
                        rows="5"></textarea></label>
                <fieldset>
                    <legend>Membership Level</legend>
                    <label><input type="radio" name="membership"
                            value="np" required>Non-Profit</label>
                    <label><input type="radio" name="membership"
                            value="bronze">Bronze</label>
                    <label><input type="radio" name="membership"
                            value="silver">Silver</label>
                    <label><input type="radio" name="membership"
                            value="gold">Gold</label>
                </fieldset>
                <input type="hidden" id="timestamp" name="timestamp">
                <button type="submit">Submit</button>
            </form>
        </section>

        <section class="join-info">
            <h2>Membership Levels</h2>
            <p>Non-Profit: Non‑profit benefits</p>
            <p>Bronze: Basic business benefits</p>
            <p>Silver: Enhanced visibility</p>
            <p>Gold: Premium placement</p>
        </section>
    </main>$

    <footer>
        <p>&copy; <span id="year"></span> Crystal River Chamber</p>
        <p>Last Updated: <span id="lastModified"></span></p>
    </footer>
</body>

</html>
